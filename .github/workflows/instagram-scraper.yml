name: Actualizar Instagram Posts

on:
  schedule:
    - cron: '0 */6 * * *' # Se ejecuta cada 6 horas
  workflow_dispatch:      # Permite ejecución manual

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write     # Permiso para hacer commit y push automáticamente

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegadores de Playwright
        run: npx playwright install chromium

      - name: Ejecutar script de scraping
        run: node bot.js

      - name: Guardar y subir cambios al repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Actualización automática con Playwright'
          file_pattern: 'posts.json'
